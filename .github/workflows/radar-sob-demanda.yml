name: Radar Games — diário + sob demanda

on:
  # Roda sozinho todo dia às 21:30 de Brasília (00:30 UTC do dia seguinte),
  # logo depois que a janela da edição fecha (21:00 -03:00).
  # O GitHub pode atrasar execuções agendadas em alguns minutos; tudo bem,
  # porque a data da edição é calculada explicitamente no passo "Definir data".
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      data:
        description: "Data específica (AAAA-MM-DD). Deixe em branco para hoje."
        required: false
        default: ""

# Nunca roda duas edições ao mesmo tempo (ex.: agendado + botão manual).
concurrency:
  group: radar-games
  cancel-in-progress: false

permissions:
  contents: write  # necessário para o /radar-games e o /adaptar-noticia poderem dar git push

jobs:
  gerar-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # deixa o git push do comando funcionar com o token do próprio Actions

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Instalar o CLI do Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configurar identidade do git para o commit automático
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"

      # Num runner do GitHub Actions ninguém está presente pra aceitar o
      # dialogo "você confia nesta pasta?" na primeira vez. Sem isso, o
      # Claude Code ignora as regras de .claude/settings.json e trava.
      # Marca a pasta do checkout como confiável de antemão, direto no
      # arquivo de configuração que o CLI le.
      - name: Marcar workspace como confiável
        run: |
          mkdir -p "$HOME"
          WORKSPACE_PATH="${GITHUB_WORKSPACE}"
          node -e "
            const fs = require('fs');
            const os = require('os');
            const path = require('os').homedir() + '/.claude.json';
            let config = {};
            if (fs.existsSync(path)) {
              try { config = JSON.parse(fs.readFileSync(path, 'utf8')); } catch (e) { config = {}; }
            }
            config.projects = config.projects || {};
            config.projects['${WORKSPACE_PATH}'] = Object.assign(
              {},
              config.projects['${WORKSPACE_PATH}'],
              { hasTrustDialogAccepted: true }
            );
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
          "

      # Mesma chamada que o radar.cmd já faz localmente — só que aqui
      # autenticada pelo token da sua assinatura (CLAUDE_CODE_OAUTH_TOKEN),
      # não por uma API key. Isso é o que preserva o "não consome
      # crédito de API" que você já tinha.
      # O runner do GitHub está em UTC. Às 00:30 UTC já é "amanhã" lá, mas
      # ainda é "hoje" em Brasília. Por isso a data é calculada no fuso de
      # São Paulo e passada explicitamente para os dois comandos.
      - name: Definir data da edição
        id: data
        run: |
          if [ -n "${{ github.event.inputs.data }}" ]; then
            echo "hoje=${{ github.event.inputs.data }}" >> "$GITHUB_OUTPUT"
          else
            echo "hoje=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Rodar /radar-games
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "/radar-games ${{ steps.data.outputs.hoje }}" --permission-mode acceptEdits
          # Se o comando parou sem gravar a edição, falha o job aqui:
          # assim o GitHub manda o e-mail de falha e o passo de adaptação
          # não roda em cima da edição antiga.
          test -f "data/games/${{ steps.data.outputs.hoje }}.json" || {
            echo "::error::A edição de ${{ steps.data.outputs.hoje }} não foi gerada."
            exit 1
          }

      # O passo 8 do próprio comando /radar-games já faz git add, commit
      # e push (veja .claude/commands/radar-games.md). Não precisa repetir
      # isso aqui. O push dispara o redeploy na Vercel automaticamente,
      # exatamente como hoje.

      # Adapta as 10 notícias do TOP 10 que acabaram de ser geradas em
      # artigos prontos para o Blog da Loja dos Gifts (mesmo padrão do
      # /adaptar-noticia manual: título com gancho, SEO, CTA da loja).
      # "todas" pula a pergunta interativa de quais posições adaptar —
      # aqui não tem ninguém pra responder. O próprio comando já faz
      # git add/commit/push dos artigos que passarem na conferência.
      - name: Adaptar as 10 notícias para o blog
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git pull --rebase
          claude -p "/adaptar-noticia todas games ${{ steps.data.outputs.hoje }}" --permission-mode acceptEdits
